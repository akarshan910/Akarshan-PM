<x-dc>
<helmet>
<style>
body{margin:0;background:#0B0B0E}
</style>
</helmet>
<div style="position: relative; width: 834px; height: 2588px; overflow: hidden; background: #0B0B0E;">

    return {
      skills: this.props.skills ?? 'sizes set in Studio (example)',
      motion: this.props.motion ?? 'full'
    };
  }
}
</script>

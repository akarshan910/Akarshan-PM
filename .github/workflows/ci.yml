name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every push to the integration branch and main gets a complete run; agent branches cancel stale ones.
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/elegant-allen-xdmal0' && github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56 --with-deps targets 24.04; ubuntu-latest moves to 26 on 19 Oct 2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run db:lint
      - run: npm run test:db
      - run: node scripts/sync-functions-lib.ts --check
      - run: npm run build
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56 --with-deps targets 24.04; ubuntu-latest moves to 26 on 19 Oct 2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - run: npm run e2e

  functions:
    name: Edge Functions type-check (Deno)
    runs-on: ubuntu-24.04 # pinned: see the checks job
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno check --config deno.json */index.ts
        working-directory: supabase/functions

  no-leaks:
    name: Drafts never leak (local Supabase)
    runs-on: ubuntu-24.04 # pinned: see the checks job
    timeout-minutes: 25
    env:
      # A local stack only (supabase/config.toml): never linked, no access token, demo keys from `supabase status`.
      PM_SITE_URL: http://localhost:4310
      PM_ALLOWED_ORIGINS: http://localhost:4310,http://127.0.0.1:4310
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Start the local stack
        # Public ECR rate-limits shared runners ("Data limit exceeded"); the same images are on Docker Hub.
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          for attempt in 1 2 3; do
            supabase start -x studio,mailpit,imgproxy,logflare,vector,supavisor,edge-runtime && exit 0
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
          exit 1
      - name: Read the local keys
        run: |
          supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "PM_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - name: Serve the pm- functions
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          printf 'PM_SITE_URL=%s\nPM_ALLOWED_ORIGINS=%s\n' "$PM_SITE_URL" "$PM_ALLOWED_ORIGINS" > supabase/functions/.env
          nohup supabase functions serve --env-file supabase/functions/.env > /tmp/functions.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/functions/v1/pm-project?slug=none" | grep -qv '^000$' && exit 0
            sleep 2
          done
          cat /tmp/functions.log; exit 1
      - name: Seed the markers
        run: npm run seed:leaks
        env:
          LEAK_MANIFEST_OUT: ${{ runner.temp }}/leaks.json
      - name: Build from the local stack
        run: npm run build
        env:
          CONTENT_SOURCE: supabase
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SITE_URL: http://localhost:4310
      - run: npx playwright install --with-deps chromium
      - name: Look for leaks
        run: npx playwright test tests/e2e/no-leaks.spec.ts --project laptop
        env:
          NO_LEAKS_MANIFEST: ${{ runner.temp }}/leaks.json
      - name: Functions log
        if: failure()
        run: cat /tmp/functions.log || true

  secrets:
    name: Secret scan (commits in the push or pull request)
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56 --with-deps targets 24.04; ubuntu-latest moves to 26 on 19 Oct 2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
